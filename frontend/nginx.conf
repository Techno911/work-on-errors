server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api requests to the backend container
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy /uploads to backend (screenshots)
    # ^~ prevents regex location ~* from intercepting .jpg/.png requests
    location ^~ /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Своя OG-карточка для ссылки-поручения на подключение CRM: её шлют администратору
    # портала в мессенджер, и превью должно объяснять задачу, а не рекламировать платформу.
    # ^~ обязателен: иначе regex-локация статики ниже перехватит путь раньше.
    location ^~ /crm-setup/ {
        try_files /crm-setup.html =404;
    }

    # SPA fallback — all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
