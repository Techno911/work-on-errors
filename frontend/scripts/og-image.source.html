<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!--
  Воспроизводимый источник public/og-image.png (1200×630): превью, которое
  мессенджер показывает человеку до входа в платформу.

  Смысл сверен с frontend/index.html и кодом продукта: «Работа над ошибками» показывает
  еженедельный разбор звонков и переписок, теги ошибок и динамику качества.
  Неделю задают weekBoundsFor() и SprintsService.getCurrent(); звонки/переписки
  доступны в AddEntryForm, теги и тренд по неделям — в AnalyticsPage.
  Здесь нет срока, цены или численного обещания: такие факты должны прийти из
  продукта, а не стареть в растровом файле.

  Пересборка: node scripts/render-og-image.mjs
  Проверка связи источника и PNG: node scripts/static-brand-assets-check.mjs

  Роли подставляются из src/index.css при рендере. Светлый янтарь #F4A467
  сохранён дословно из предыдущего OG-источника; акцент платформы не меняется.
  Inter лежит рядом с источником: рендер не зависит от системных шрифтов.
  Домен вынесен отдельной строкой: прежняя строка трёх плашек обрезала его.

  Шапка приведена к канону оболочки §13 (17.09.2026): слева знак и «Чирков
  и партнёры» одним блоком, справа надзаголовок платформы разрядкой
  моноширинным янтарным. Раскладка знак-справа/имя-в-надзаголовке была
  своей раскладкой РО и признана дефектом каноном.
-->
<style>
  __INTER_FONT_FACES__
  :root {
    --og-surface: __ROLE_COLOR_INVERSE__;
    --og-on-dark: __ROLE_COLOR_ON_INVERSE__;
    --og-on-dark-subtle: __ROLE_COLOR_ON_INVERSE_MUTED__;
    --og-border: __ROLE_COLOR_INVERSE_DIVIDER__;
    --og-panel: __ROLE_COLOR_INVERSE_HOVER__;
    --og-font: __ROLE_FONT_BODY__;
    --og-font-mono: __ROLE_FONT_MONO__;
    --og-accent-on-dark: #F4A467;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--og-surface);
    color: var(--og-on-dark);
    font-family: var(--og-font);
  }
  .canvas { position: relative; height: 100%; padding: 76px 80px; }
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; }
  .brand { display: flex; align-items: center; gap: 18px; flex: none; }
  .brand-mark { display: block; width: 48px; height: auto; filter: invert(1); }
  .brand-name { font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--og-on-dark); white-space: nowrap; }
  .kicker { padding-top: 10px; max-width: 480px; color: var(--og-accent-on-dark); font-family: var(--og-font-mono); font-size: 20px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; text-align: right; }
  h1 { max-width: 930px; margin-top: 44px; font-size: 96px; font-weight: 800; letter-spacing: -.055em; line-height: 1.04; }
  .accent-line { display: flex; align-items: center; gap: 20px; margin-top: 42px; color: var(--og-accent-on-dark); font-size: 38px; font-weight: 700; letter-spacing: -.025em; }
  .accent-line::before { content: ""; width: 56px; height: 6px; border-radius: 999px; background: currentColor; }
  .chips { position: absolute; left: 80px; right: 80px; bottom: 88px; display: flex; align-items: center; gap: 16px; }
  .chip { display: flex; align-items: center; gap: 14px; padding: 16px 24px; border: 1px solid var(--og-border); border-radius: 999px; background: var(--og-panel); color: var(--og-on-dark); font-size: 25px; font-weight: 600; white-space: nowrap; }
  .dot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--og-accent-on-dark); }
  .domain { position: absolute; right: 80px; bottom: 32px; color: var(--og-on-dark-subtle); font-size: 22px; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
  <main class="canvas">
    <div class="top-row">
      <div class="brand">
        <img class="brand-mark" src="../public/logo/logo-mark.svg" alt="">
        <span class="brand-name">Работа над ошибками</span>
      </div>
      <p class="kicker">Платформа для отдела продаж</p>
    </div>
    <h1>Продажи больше<br>не чёрный ящик</h1>
    <p class="accent-line">Разбор звонков и переписок каждую неделю</p>
    <div class="chips">
      <span class="chip"><span class="dot"></span>еженедельный разбор</span>
      <span class="chip"><span class="dot"></span>теги ошибок</span>
      <span class="chip"><span class="dot"></span>динамика качества</span>
    </div>
    <span class="domain">app.example.invalid</span>
  </main>
</body>
</html>
