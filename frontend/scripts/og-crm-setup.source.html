<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<!--
  Воспроизводимое CRM-превью 1200×630. Старый растр обещал три шага и пять
  минут, но CrmConnectWizard, используемый CrmSetupPage, содержит шаги 1–4.
  Срок подключения кодом не подтверждён: числовое обещание убрано.
  Самостоятельный импорт звонков подтверждён CRM-интеграцией продукта.
  Янтарь #B45309 и обе его rgba-развёртки сохранены дословно.
  Нейтральные роли приходят из index.css; Inter локальный, без внешней сети.
  Пересборка: node scripts/render-og-image.mjs --source scripts/og-crm-setup.source.html --output public/og-crm-setup.jpg
  Контроль: static-brand-assets-check.mjs пересобирает JPG и сравнивает SHA.
-->
<style>
  __INTER_FONT_FACES__
  :root {
    --og-surface: __ROLE_COLOR_INVERSE__;
    --og-fg: __ROLE_COLOR_ON_INVERSE__;
    --og-subtle: __ROLE_COLOR_ON_INVERSE_MUTED__;
    --og-panel: __ROLE_COLOR_INVERSE_HOVER__;
    --og-border: __ROLE_COLOR_INVERSE_DIVIDER__;
    --og-font: __ROLE_FONT_BODY__;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background:
      radial-gradient(900px 520px at 88% 108%, rgba(180,83,9,0.30) 0%, rgba(180,83,9,0.06) 45%, transparent 72%),
      var(--og-surface);
    font-family: var(--og-font);
    color: var(--og-fg);
    padding: 64px 72px 82px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .kicker {
    font-size: 22px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--og-subtle);
  }
  h1 { font-size: 92px; font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; }
  .lead { font-size: 33px; font-weight: 600; line-height: 1.3; color: var(--og-fg); margin-top: 22px; max-width: 900px; }
  .accent { color: #B45309; }
  .sub {
    display: flex; align-items: center; gap: 18px;
    font-size: 34px; font-weight: 700; color: #B45309; margin-top: 26px;
  }
  .sub .rule { width: 56px; height: 5px; background: #B45309; border-radius: 4px; flex: none; }
  .chips { display: flex; gap: 12px; align-items: center; }
  .chip {
    display: flex; align-items: center; gap: 12px;
    background: var(--og-panel); border: 1px solid var(--og-border);
    border-radius: 999px; padding: 14px 22px;
    font-size: 22px; font-weight: 600; color: var(--og-fg); white-space: nowrap;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #B45309; flex: none; }
  .domain { position: absolute; right: 72px; bottom: 22px; font-size: 22px; white-space: nowrap; font-weight: 600; color: var(--og-subtle); }
  .mark { position: absolute; top: 58px; right: 68px; width: 74px; color: var(--og-fg); }
  .mark svg { width: 100%; height: auto; display: block; }
</style>
</head>

  </div>

  <div class="kicker">Работа над ошибками · Работа над ошибками</div>

  <div>
    <h1>Подключение <span class="accent">CRM</span></h1>
    <div class="sub"><span class="rule"></span><span>Подключите CRM один раз</span></div>
    <p class="lead">Записи звонков будут подтягиваться в платформу сами, без ручной загрузки файлов.</p>
  </div>

  <div class="chips">
    <div class="chip"><span class="dot"></span>Битрикс24 · amoCRM</div>
    <div class="chip"><span class="dot"></span>права администратора</div>
    <div class="chip"><span class="dot"></span>без входа в платформу</div>
    <div class="domain">app.example.invalid</div>
  </div>
</body>
</html>
